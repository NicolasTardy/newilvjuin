# Reverse proxy Nginx pour newilv.triangleoffensif.fr
# A placer dans /etc/nginx/sites-available/newilv puis lier dans sites-enabled.
# Le bloc HTTPS (443) est ajouté automatiquement par certbot.

server {
    listen 80;
    listen [::]:80;
    server_name newilv.triangleoffensif.fr;

    # Taille max upload (imports xlsx volumineux)
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
